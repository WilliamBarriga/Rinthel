# Deck, the web portal of the Instance. It enters the root compose by `include:`;
# the root `.env` is the only one (there is no deck/.env). Paths are relative to deck/.
services:
  deck:
    build: .
    restart: unless-stopped
    # Linux: the daemon listens on the host loopback, and the host network makes
    # 127.0.0.1 inside the container the host's own.
    network_mode: host
    # The same uid/gid as the host user, so what Deck writes under data/deck stays
    # editable from outside the container. 1000:1000 when unset.
    user: "${PUID:-1000}:${PGID:-1000}"
    # The host's docker group (written by INSTALL), for the Docker socket below;
    # unset, the user's own group (and no docker mode for the browser).
    group_add:
      - "${DOCKER_GID:-${PGID:-1000}}"
    volumes:
      # The Instance browser in docker mode: Deck installs, starts and stops the
      # `deck-browser` container over the socket. Without it Deck falls back to a
      # local Chrome, or to an external one with BROWSER_EXTERNAL=true.
      - /var/run/docker.sock:/var/run/docker.sock
      # The volume of Deck: deck.db, the home of pi (HOME=/data/home, so the
      # agentDir is data/deck/home/.pi/agent), sessions and slots.
      - ../data/deck:/data
      # Certificates, when you have them. Empty by default.
      - ${PORTAL_TLS_DIR:-/dev/null}:/certs:ro
    environment:
      # With host networking Deck binds PORT directly on the host.
      PORT: ${RINTHEL_DECK_PORT:-4100}
      # Signs the Panel tokens; the same secret the daemon signs them with,
      # generated by INSTALL in the root .env. Checked by the server, not here:
      # a `:?` would block every `docker compose` call of the root project.
      RINTHEL_PANEL_SECRET: ${RINTHEL_PANEL_SECRET:-}
      # What the daemon sends to retire a user's Sessions, and what Deck sends
      # to read a user's live role. Generated by INSTALL.
      RINTHEL_SERVICE_SECRET: ${RINTHEL_SERVICE_SECRET:-}
      RINTHEL_DAEMON_URL: http://127.0.0.1:${RINTHEL_DAEMON_PORT:-8765}
      # hostexecd, for an admin's host exec tools (Linux only). The daemon passes
      # both when it brings Deck up, the URL built with `deck.host_address`; where
      # hostexecd does not run it passes an empty token and Deck loads no such tools.
      RINTHEL_HOSTEXECD_URL: ${RINTHEL_HOSTEXECD_URL:-http://127.0.0.1:${RINTHEL_HOSTEXECD_PORT:-8766}}
      RINTHEL_HOSTEXECD_TOKEN: ${RINTHEL_HOSTEXECD_TOKEN:-}
      # Understory's token, for an admin's Memoria tools. The daemon hands the
      # URL per Platform (routing); without a token no Session has Memoria.
      UNDERSTORY_TOKEN: ${UNDERSTORY_TOKEN:-}
      # The Instance browser: its fixed CDP endpoint, and `true` for one started
      # and stopped outside Deck (only found, never managed).
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-http://127.0.0.1:9222}
      BROWSER_EXTERNAL: ${BROWSER_EXTERNAL:-false}
      # `delete` where WAL cannot work on the bind mount (Windows).
      DECK_DB_JOURNAL_MODE: ${DECK_DB_JOURNAL_MODE:-wal}
      # Serve Deck over TLS when both are given.
      PORTAL_TLS_CERT: ${PORTAL_TLS_CERT:-}
      PORTAL_TLS_KEY: ${PORTAL_TLS_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
