# Managed modules: merge each subtree with its Rinthel override before include.
# Relative build/data paths remain anchored to the original subtree directory.
include:
  - path:
      - understory/docker-compose.yml
      - compose/understory.override.yaml
    project_directory: understory
  - path:
      - pithagoras/docker-compose.yml
      - compose/host-exec.override.yaml
    project_directory: pithagoras
