# The Instance's compose project. One `.env`, the root one.
#
# Deck keeps its own deck/docker-compose.yml and enters by `include:`.
# Understory enters by `extends:`, because `include:` does not let the parent
# redefine an imported service: its fixed network and host alias are set here.
name: rinthel-general

include:
  - deck/docker-compose.yml

services:
  understory:
    extends:
      file: understory/docker-compose.yml
      service: understory
    # The host loopback only: Deck reaches it there on Linux (host network);
    # no LAN, no tailscale. `!override` replaces the subtree's list, which
    # publishes on every interface.
    ports: !override
      - "127.0.0.1:${RINTHEL_UNDERSTORY_PORT:-3800}:3800"
    environment:
      # One token, the one Deck presents. The subtree reads AUTH_TOKEN, and an
      # empty one is Understory without auth, so an unset one fails here.
      AUTH_TOKEN: ${UNDERSTORY_TOKEN:?UNDERSTORY_TOKEN is not set in the root .env; run INSTALL}
    networks:
      - understory-net
    # The subtree says "host.docker.internal:host-gateway", which Docker
    # resolves against the default bridge (172.17.0.1), not this network's
    # gateway. `!override` replaces the whole list instead of adding to it.
    extra_hosts: !override
      - "host.docker.internal:172.30.99.1"

# A fixed bridge and gateway, kept across `compose down && up`, so the host's
# iptables/route_localnet rules for it are never orphaned. The "rg" suffix keeps
# its Linux names apart from any other environment on the same host.
networks:
  understory-net:
    name: rinthel-general_understory_net
    driver_opts:
      com.docker.network.bridge.name: br-rgunderstory
    ipam:
      config:
        - subnet: 172.30.99.0/24
