# Not included by the root compose: kept until host exec moves into Deck.
# Paths are relative to the directory of the compose project that includes it.
services:
  portal:
    volumes:
      - type: bind
        source: ../extensions/rinthel-host-exec
        target: /app/rinthel-extensions/rinthel-host-exec
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../extensions/rinthel-subagents
        target: /app/rinthel-extensions/rinthel-subagents
        read_only: true
        bind:
          create_host_path: false
    environment:
      RINTHEL_SUBAGENTS_EXTENSION: /app/rinthel-extensions/rinthel-subagents/index.ts
      RINTHEL_HOST_EXEC_EXTENSION: /app/rinthel-extensions/rinthel-host-exec/index.ts
