services:
  understory:
    build: .
    ports:
      - "3800:3800"
    # Lets the container reach a llama.cpp server running on the host via
    # http://host.docker.internal:8080/v1 (see "Local llama.cpp" in the README).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bundle real (memoria viva), no el demo del fork — vive fuera del
      # subtree para que nunca se cuele en un `git subtree push`.
      - ../data/understory:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Primary model
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      # Legacy compat (still supported)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OJO: no ${OPENROUTER_API_KEY} a secas — Pithagoras declara esa misma
      # var (su propio fallback provider) en el mismo .env compartido de la
      # raíz desde la consolidación de Fase 2. Si understory la heredara,
      # aborta con "Ambiguous legacy LLM configuration" al tenerla sola sin
      # LLM_API_BASE_URL/LLM_API_KEY. Nombre propio, sin setear todavía —
      # wiring real de model provider es Fase 4, no esta.
      OPENROUTER_API_KEY: ${UNDERSTORY_OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-false}
    restart: unless-stopped
