services:
  tts-piper:
    build: .
    ports:
      - "127.0.0.1:${PORT}:8091"   # solo loopback del host — mismo criterio
                                     # que understory/whisper-stt.
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH}
    restart: unless-stopped
