[project]
name = "rinthel-tui"
version = "0.1.0"
description = "TUI para gestionar el ciclo de vida de llama-server + Understory + Pithagoras"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["textual>=0.80", "pyfiglet>=1.0.4", "psutil>=5.9", "python-dotenv>=1.0"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
rinthel = "rinthel_tui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rinthel_tui*"]
